<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="description" content="GODFAVOUR Construction project, BOQ and cost management"><link rel="manifest" href="manifest.webmanifest"><title>GODFAVOUR Construction</title>
<style>
:root{--navy:#101b2b;--navy2:#18283e;--gold:#d7a94b;--bg:#f3f5f8;--card:#fff;--ink:#172235;--muted:#718096;--line:#e6eaf0;--green:#16845b;--red:#c54b4b;--shadow:0 8px 28px #1722350c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 26px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#f0cb78,#b47b23);display:grid;place-items:center;color:#172235;font-weight:900;font-size:17px}.brand strong{display:block;font-size:13px;letter-spacing:.06em}.brand small{color:#aab7c8;font-size:10px;letter-spacing:.14em}.navlabel{color:#8494a9;font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:12px 10px 7px}.nav button{width:100%;border:0;background:transparent;color:#b9c4d2;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff14;color:#fff}.nav .ico{width:20px;text-align:center;color:var(--gold)}.sidefoot{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 8px;color:#9eacbd;font-size:11px}.main{margin-left:248px;min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.topbar h1{font-size:18px;margin:0}.topbar small{color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.content{max-width:1400px;margin:auto;padding:28px 30px 60px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h2{margin:0 0 5px;font-size:23px}.pagehead p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:650}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d2633}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:17px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin:8px 0 3px;letter-spacing:-.03em}.stat small{color:var(--muted)}.stat .symbol{float:right;background:#f8f1e3;color:#9b6d1d;border-radius:9px;padding:8px}.panel{padding:19px;margin-top:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panelhead h3{font-size:15px;margin:0}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:650;background:#fafbfd}td strong{font-size:13px}.right{text-align:right}.pill{display:inline-block;border-radius:99px;padding:4px 8px;background:#edf6f1;color:var(--green);font-size:10px;font-weight:700}.pill.pending{background:#fff5df;color:#986c17}.pill.closed{background:#eef0f3;color:#667085}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:11px;font-weight:700;color:#566275}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dce2ea;background:#fff;border-radius:8px;padding:10px 11px;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d7a94b20}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.empty{text-align:center;padding:34px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.actions{display:flex;gap:6px}.hidden{display:none!important}.notice{padding:12px 14px;background:#fff8e9;border:1px solid #f0dfb8;border-radius:9px;color:#75551a;font-size:12px;margin:15px 0}.boqtotals{display:flex;justify-content:flex-end;gap:30px;flex-wrap:wrap;padding-top:14px}.boqtotals strong{font-size:16px}.modalback{position:fixed;inset:0;background:#101b2b88;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 17px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.mobilebar{display:none}.chartbars{display:flex;align-items:end;gap:10px;height:140px;padding:10px 4px 0}.barcol{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:linear-gradient(180deg,#e4bd6d,#c18a2d);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:6px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick .btn{font-size:12px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.sidebar{display:none}.main{margin-left:0;padding-bottom:68px}.topbar{height:60px;padding:0 16px}.topbar h1{font-size:15px}.topbar small{display:none}.content{padding:20px 14px 35px}.pagehead h2{font-size:20px}.pagehead{align-items:center}.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:19px}.stat .symbol{padding:5px}.panel{padding:14px;margin-top:12px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:flex-start;overflow-x:auto;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:none;color:#69778a;font-size:9px;display:flex;flex:0 0 66px;flex-direction:column;align-items:center;gap:2px;padding:3px}.mobilebar button span{font-size:18px}.mobilebar button.active{color:#a87924}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead .btn{font-size:11px;padding:8px}.top-actions .btn{padding:7px 9px;font-size:11px}}
@media print{.sidebar,.topbar,.mobilebar,.no-print,.btn{display:none!important}.main{margin:0}.content{padding:0}.panel,.stat{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">GC</div><div><strong>GODFAVOUR</strong><small>CONSTRUCTION</small></div></div><div class="navlabel">Workspace</div><nav class="nav" id="sidenav"></nav><div class="sidefoot">Building for a Better Tomorrow.<br>Construction Suite · Offline Ready</div></aside><main class="main"><header class="topbar"><div><h1 id="topTitle">Dashboard</h1><small id="today"></small></div><div class="top-actions"><button class="btn" onclick="exportBackup()">↧ Backup</button><button class="btn primary" onclick="openProjectModal()">＋ New Project</button></div></header><div class="content" id="view"></div></main><nav class="mobilebar" id="mobilenav"></nav></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const KEY='godfavour_construction_v1';const money=n=>'FCFA '+Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:0});const num=n=>Number(n)||0;const today=new Date().toISOString().slice(0,10);let db=load();let page='dashboard';let boqProject=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}function seed(){return {settings:{company:'GODFAVOUR CONSTRUCTION',manager:'N DIELAND BANTAR',slogan:'Building for a Better Tomorrow.',currency:'FCFA'},projects:[],clients:[],materials:[{id:1,name:'Cement 42.5',unit:'bag',price:5200,stock:0},{id:2,name:'Sand',unit:'m³',price:85000,stock:0},{id:3,name:'Gravel',unit:'load',price:280000,stock:0},{id:4,name:'Block 20×40',unit:'piece',price:400,stock:0},{id:5,name:'Rod 10 mm',unit:'piece',price:4800,stock:0},{id:6,name:'Rod 8 mm',unit:'piece',price:3200,stock:0},{id:7,name:'Rod 6 mm',unit:'piece',price:1900,stock:0}],labour:[],boqs:[],expenses:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()};const nav=[['dashboard','▦','Dashboard'],['projects','▤','Projects'],['boq','▥','BOQ & Estimates'],['materials','▧','Materials'],['labour','♙','Labour'],['clients','♧','Clients'],['expenses','↗','Expenses'],['reports','▤','Reports'],['settings','⚙','Settings']];function navHtml(){return nav.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${t}</button>`).join('')}function go(p){page=p;render()}function moneyInput(v){return Number(v||0).toLocaleString('fr-FR')}function projectCost(id){return db.boqs.filter(b=>b.projectId==id).reduce((s,b)=>s+b.total,0)+db.expenses.filter(e=>e.projectId==id).reduce((s,e)=>s+e.amount,0)}function render(){document.getElementById('sidenav').innerHTML=navHtml();document.getElementById('mobilenav').innerHTML=nav.filter(x=>['dashboard','projects','boq','materials','reports'].includes(x[0])).map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join('');document.getElementById('topTitle').textContent=nav.find(x=>x[0]===page)[2];document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});({dashboard,projects,boq,materials,labour,clients,expenses,reports,settings}[page]||dashboard)();}
function head(title,sub,btn=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${btn}</div>`}function stat(label,value,sub,ico){return `<div class="stat"><span class="symbol">${ico}</span><div class="label">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}function dashboard(){let active=db.projects.filter(p=>p.status!=='Completed').length,boq=db.boqs.reduce((s,b)=>s+b.total,0),exp=db.expenses.reduce((s,e)=>s+e.amount,0),budget=db.projects.reduce((s,p)=>s+num(p.budget),0);document.getElementById('view').innerHTML=head('Good work starts with good control.','Your construction operations at a glance.',`<button class="btn primary" onclick="openProjectModal()">＋ Add project</button>`)+`<div class="grid">${stat('Active projects',active,db.projects.length+' total projects','▤')}${stat('Estimated BOQ value',money(boq),'Across all estimates','▥')}${stat('Recorded expenses',money(exp),'All project expenses','↗')}${stat('Total project budgets',money(budget),'Assigned budgets','◈')}</div><div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:17px"><section class="panel" style="margin:0"><div class="panelhead"><h3>Recent projects</h3><button class="btn small" onclick="go('projects')">View all</button></div>${projectTable(db.projects.slice(-5).reverse())}</section><section class="panel" style="margin:0"><div class="panelhead"><h3>Quick actions</h3></div><div class="quick"><button class="btn" onclick="openProjectModal()">＋ Project</button><button class="btn" onclick="openBoqModal()">＋ BOQ</button><button class="btn" onclick="openExpenseModal()">＋ Expense</button><button class="btn" onclick="openMaterialModal()">＋ Material</button></div><div class="notice">Your data is saved on this device. Export a backup regularly before changing or resetting your phone.</div><h3 style="font-size:13px">Business profile</h3><b>${esc(db.settings.company)}</b><div class="muted">${esc(db.settings.slogan)}</div></section></div><section class="panel"><div class="panelhead"><h3>Latest expenses</h3><button class="btn small" onclick="go('expenses')">Manage</button></div>${expenseTable(db.expenses.slice(-5).reverse())}</section>`}
function projectTable(items){if(!items.length)return `<div class="empty"><b>No projects yet</b>Create your first project to start tracking costs.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Project</th><th>Client</th><th>Start date</th><th>Status</th><th class="right">Budget</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.location||'')}</span></td><td>${esc(clientName(p.clientId))}</td><td>${p.date||'—'}</td><td><span class="pill ${p.status==='Completed'?'closed':p.status==='On hold'?'pending':''}">${p.status}</span></td><td class="right">${money(p.budget)}</td><td><button class="btn small" onclick="editProject(${p.id})">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function projects(){document.getElementById('view').innerHTML=head('Projects','Create and monitor construction jobs.',`<button class="btn primary" onclick="openProjectModal()">＋ New project</button>`)+`<div class="panel"><div class="toolbar"><input class="search" placeholder="Search projects..." oninput="filterRows(this,'projectrows')"></div><div id="projectrows">${projectTable([...db.projects].reverse())}</div></div>`}
function boq(){document.getElementById('view').innerHTML=head('BOQ & Estimates','Build itemized bills of quantities and calculate totals.',`<button class="btn primary" onclick="openBoqModal()">＋ New estimate</button>`)+`<div class="panel"><div class="panelhead"><h3>Saved estimates</h3><span class="muted">${db.boqs.length} estimates</span></div>${db.boqs.length?`<div class="tablewrap"><table><thead><tr><th>Estimate</th><th>Project</th><th>Date</th><th>Items</th><th class="right">Total</th><th></th></tr></thead><tbody>${[...db.boqs].reverse().map(b=>`<tr><td><strong>${esc(b.name)}</strong></td><td>${esc(projectName(b.projectId))}</td><td>${b.date}</td><td>${b.items.length}</td><td class="right">${money(b.total)}</td><td><button class="btn small" onclick="viewBoq(${b.id})">View / Print</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No estimates saved</b>Create an estimate and add quantities, rates and units.</div>`}</div>`}
function materials(){document.getElementById('view').innerHTML=head('Materials & Stock','Maintain material rates and track stock quantities.',`<button class="btn primary" onclick="openMaterialModal()">＋ Add material</button>`)+`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Material</th><th>Unit</th><th>Unit price</th><th>Stock quantity</th><th></th></tr></thead><tbody>${db.materials.map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.unit)}</td><td>${money(m.price)}</td><td>${num(m.stock).toLocaleString('fr-FR')}</td><td><button class="btn small" onclick="editMaterial(${m.id})">Edit</button> <button class="btn small danger" onclick="del('materials',${m.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div><div class="notice">Starter rates are editable examples based on previously supplied estimates. Confirm current supplier prices before issuing a quotation.</div>`}
function labour(){document.getElementById('view').innerHTML=head('Labour & Workforce','Record workers, roles and labour payments.',`<button class="btn primary" onclick="openLabourModal()">＋ Add labour record</button>`)+`<div class="panel">${db.labour.length?`<div class="tablewrap"><table><thead><tr><th>Worker / Team</th><th>Project</th><th>Role</th><th>Date</th><th class="right">Amount</th><th></th></tr></thead><tbody>${[...db.labour].reverse().map(l=>`<tr><td><strong>${esc(l.name)}</strong></td><td>${esc(projectName(l.projectId))}</td><td>${esc(l.role)}</td><td>${l.date}</td><td class="right">${money(l.amount)}</td><td><button class="btn small danger" onclick="del('labour',${l.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No labour records</b>Add labour costs to track project spending.</div>`}</div>`}
function clients(){document.getElementById('view').innerHTML=head('Clients','Manage customer contact details.',`<button class="btn primary" onclick="openClientModal()">＋ Add client</button>`)+`<div class="panel">${db.clients.length?`<div class="tablewrap"><table><thead><tr><th>Client</th><th>Phone</th><th>Email</th><th>Projects</th><th></th></tr></thead><tbody>${db.clients.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${db.projects.filter(p=>p.clientId==c.id).length}</td><td><button class="btn small danger" onclick="del('clients',${c.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No clients added</b>Add a client before creating a client-linked project.</div>`}</div>`}
function expenses(){document.getElementById('view').innerHTML=head('Expenses','Record purchases, transport and other project costs.',`<button class="btn primary" onclick="openExpenseModal()">＋ Record expense</button>`)+`<div class="panel"><div class="panelhead"><h3>Expense register</h3><strong>${money(db.expenses.reduce((s,e)=>s+e.amount,0))}</strong></div>${expenseTable([...db.expenses].reverse())}</div>`}function expenseTable(items){if(!items.length)return `<div class="empty">No expenses recorded.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Description</th><th>Project</th><th>Category</th><th>Date</th><th class="right">Amount</th><th></th></tr></thead><tbody>${items.map(e=>`<tr><td><strong>${esc(e.desc)}</strong></td><td>${esc(projectName(e.projectId))}</td><td>${esc(e.category)}</td><td>${e.date}</td><td class="right">${money(e.amount)}</td><td><button class="btn small danger" onclick="del('expenses',${e.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function reports(){let total= db.boqs.reduce((s,b)=>s+b.total,0),expensesTotal=db.expenses.reduce((s,e)=>s+e.amount,0)+db.labour.reduce((s,l)=>s+l.amount,0);document.getElementById('view').innerHTML=head('Reports & Documents','Review totals and print or save your records.',`<button class="btn primary" onclick="window.print()">Print report</button>`)+`<div class="grid">${stat('BOQ estimates',money(total),db.boqs.length+' documents','▥')}${stat('Expenses',money(expensesTotal),'Expenses + labour','↗')}${stat('Clients',db.clients.length,'Registered clients','♧')}${stat('Projects',db.projects.length,'All projects','▤')}</div><div class="panel"><div class="panelhead"><h3>Project cost summary</h3><button class="btn small" onclick="exportCSV()">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Budget</th><th>BOQ value</th><th>Expenses</th><th>Labour</th><th>Remaining budget*</th></tr></thead><tbody>${db.projects.map(p=>{let b=db.boqs.filter(x=>x.projectId==p.id).reduce((s,x)=>s+x.total,0),e=db.expenses.filter(x=>x.projectId==p.id).reduce((s,x)=>s+x.amount,0),l=db.labour.filter(x=>x.projectId==p.id).reduce((s,x)=>s+x.amount,0);return `<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.budget)}</td><td>${money(b)}</td><td>${money(e)}</td><td>${money(l)}</td><td>${money(num(p.budget)-b-e-l)}</td></tr>`}).join('')}</tbody></table></div><p class="muted" style="font-size:10px">*Remaining budget is a simple budget less recorded BOQ, expenses and labour; it is not an accounting balance.</p></div><div class="panel"><h3 style="margin-top:0">Data protection</h3><p class="muted">Export a JSON backup to preserve all projects, clients, estimates and costs. The backup stays on your device unless you share it.</p><button class="btn" onclick="exportBackup()">Download full backup</button> <label class="btn">Import backup<input type="file" accept="application/json" hidden onchange="importBackup(event)"></label></div>`}
function settings(){document.getElementById('view').innerHTML=head('Company settings','Customize your company identity and default details.')+`<div class="panel"><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>Company name</label><input name="company" value="${esc(db.settings.company)}" required></div><div class="field"><label>Manager</label><input name="manager" value="${esc(db.settings.manager)}"></div><div class="field full"><label>Slogan</label><input name="slogan" value="${esc(db.settings.slogan)}"></div><div class="field"><label>Currency</label><select name="currency"><option>FCFA</option><option ${db.settings.currency==='EUR'?'selected':''}>EUR</option><option ${db.settings.currency==='USD'?'selected':''}>USD</option></select></div></div><button class="btn primary">Save settings</button></form></div><div class="panel"><h3 style="margin-top:0">App information</h3><p class="muted">GODFAVOUR Construction Suite · Local-first edition. Records are stored in this browser on this device. Use Backup before clearing browser data or changing phones.</p><button class="btn" onclick="exportBackup()">Export backup</button> <button class="btn danger" onclick="resetData()">Reset all app data</button></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clientName(id){return db.clients.find(c=>c.id==id)?.name||'—'}function projectName(id){return db.projects.find(p=>p.id==id)?.name||'—'}function optsProjects(id){return `<option value="">No project</option>`+db.projects.map(p=>`<option value="${p.id}" ${p.id==id?'selected':''}>${esc(p.name)}</option>`).join('')}function optsClients(id){return `<option value="">Select client</option>`+db.clients.map(c=>`<option value="${c.id}" ${c.id==id?'selected':''}>${esc(c.name)}</option>`).join('')}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}function closeModal(){document.getElementById('modalback').classList.remove('show')}function nextId(arr){return Math.max(0,...arr.map(x=>x.id||0))+1}
function openProjectModal(p={}){modal(`<h3>${p.id?'Edit':'New'} project</h3><form onsubmit="saveProject(event,${p.id||0})"><div class="formgrid"><div class="field full"><label>Project name *</label><input name="name" required value="${esc(p.name||'')}"></div><div class="field"><label>Client</label><select name="clientId">${optsClients(p.clientId)}</select></div><div class="field"><label>Location</label><input name="location" value="${esc(p.location||'')}"></div><div class="field"><label>Start date</label><input type="date" name="date" value="${p.date||today}"></div><div class="field"><label>Budget (FCFA)</label><input type="number" min="0" name="budget" value="${p.budget||0}"></div><div class="field"><label>Status</label><select name="status">${['Planning','In progress','On hold','Completed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save project</button></div></form>`)}function saveProject(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=id||nextId(db.projects);f.clientId=num(f.clientId);f.budget=num(f.budget);let i=db.projects.findIndex(x=>x.id==id);if(i>=0)db.projects[i]=f;else db.projects.push(f);closeModal();save()}function editProject(id){let p=db.projects.find(x=>x.id==id);openProjectModal(p)}

function openBoqModal(){if(!db.projects.length){alert('Create a project first.');return}let p=db.projects[0];modal(`<h3>New BOQ / Estimate</h3><form onsubmit="createBoq(event)"><div class="field"><label>Estimate title *</label><input name="name" required value="Foundation works"></div><div class="formgrid"><div class="field"><label>Project</label><select name="projectId">${optsProjects(p.id)}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today}"></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create estimate</button></div></form>`)}function createBoq(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let b={id:nextId(db.boqs),name:f.name,projectId:num(f.projectId),date:f.date,items:[],total:0};db.boqs.push(b);closeModal();save();viewBoq(b.id)}function viewBoq(id){let b=db.boqs.find(x=>x.id==id);if(!b)return;boqProject=id;page='boq';render();let area=document.getElementById('view');area.innerHTML=head(b.name,`Project: ${projectName(b.projectId)} · ${b.date}`,`<button class="btn" onclick="go('boq')">← Back</button> <button class="btn primary" onclick="addBoqItem(${id})">＋ Add item</button> <button class="btn gold" onclick="printBoq(${id})">Print / PDF</button>`)+`<div class="panel"><div class="panelhead"><div><b>${esc(db.settings.company)}</b><div class="muted">${esc(db.settings.slogan)}</div></div><div class="muted">Estimate #${b.id}</div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Description</th><th>Unit</th><th class="right">Quantity</th><th class="right">Rate</th><th class="right">Amount</th><th></th></tr></thead><tbody>${b.items.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.desc)}</strong></td><td>${esc(x.unit)}</td><td class="right">${x.qty}</td><td class="right">${money(x.rate)}</td><td class="right">${money(x.qty*x.rate)}</td><td><button class="btn small danger" onclick="removeBoqItem(${id},${i})">×</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No items. Add your first BOQ line.</td></tr>`}</tbody></table></div><div class="boqtotals"><div><span class="muted">Subtotal</span><br><strong>${money(b.total)}</strong></div><div><span class="muted">Grand total</span><br><strong>${money(b.total)}</strong></div></div><p class="muted" style="font-size:10px">Rates and quantities are estimates. Verify measurements, specifications, wastage and supplier quotations before execution.</p></div>`}
function addBoqItem(id){let b=db.boqs.find(x=>x.id==id);modal(`<h3>Add BOQ line</h3><form onsubmit="saveBoqItem(event,${id})"><div class="field"><label>Description *</label><input name="desc" required></div><div class="formgrid"><div class="field"><label>Unit</label><input name="unit" placeholder="m³, m², bag, kg"></div><div class="field"><label>Quantity</label><input name="qty" type="number" step="0.001" min="0" required></div><div class="field"><label>Rate (FCFA)</label><input name="rate" type="number" min="0" required></div><div class="field"><label>Quick-fill material (optional)</label><select onchange="if(this.value){let m=db.materials.find(x=>x.id==this.value);this.form.desc.value=m.name;this.form.unit.value=m.unit;this.form.rate.value=m.price}"><option value="">Choose material</option>${db.materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add line</button></div></form>`)}function saveBoqItem(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),b=db.boqs.find(x=>x.id==id);f.qty=num(f.qty);f.rate=num(f.rate);b.items.push(f);b.total=b.items.reduce((s,x)=>s+x.qty*x.rate,0);closeModal();save();viewBoq(id)}function removeBoqItem(id,i){let b=db.boqs.find(x=>x.id==id);b.items.splice(i,1);b.total=b.items.reduce((s,x)=>s+x.qty*x.rate,0);save();viewBoq(id)}function printBoq(id){let b=db.boqs.find(x=>x.id==id);let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print this estimate.');return}w.document.write(`<html><head><title>${esc(b.name)}</title><style>body{font:13px Arial;padding:30px;color:#172235}h1{font-size:20px}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}th{background:#f2f4f7}.r{text-align:right}.total{text-align:right;margin-top:25px;font-size:18px;font-weight:bold}.muted{color:#667085} function del(key,id){if(!confirm('Delete this record?'))return;db[key]=db[key].filter(x=>x.id!=id);save()}function filterRows(input,id){let q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function saveSettings(e){e.preventDefault();db.settings={...db.settings,...Object.fromEntries(new FormData(e.target))};save()}function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'godfavour-backup-'+today+'.json')}function importBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.projects||!x.settings)throw 0;if(confirm('Replace current app data with this backup?')){db=x;save();alert('Backup imported.')}}catch(err){alert('Invalid backup file.')}};r.readAsText(file)}function exportCSV(){let rows=[['Project','Budget','BOQ','Expenses','Labour']];db.projects.forEach(p=>rows.push([p.name,p.budget,db.boqs.filter(b=>b.projectId==p.id).reduce((s,b)=>s+b.total,0),db.expenses.filter(e=>e.projectId==p.id).reduce((s,e)=>s+e.amount,0),db.labour.filter(l=>l.projectId==p.id).reduce((s,l)=>s+l.amount,0)]));download(new Blob([rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),'godfavour-project-report.csv')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('This permanently deletes all app records on this device. Export a backup first. Continue?')&&confirm('Final confirmation: delete all data?')){db=seed();save()}}

// Include procurement and labour costs in project-level financial summaries.
const priorProjectCost=projectCost;
projectCost=function(id){return priorProjectCost(id)+db.labour.filter(x=>x.projectId==id).reduce((a,x)=>a+num(x.amount),0)+db.purchaseOrders.filter(x=>x.projectId==id).reduce((a,x)=>a+num(x.qty)*num(x.rate),0)};

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
